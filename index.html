<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>멘사창의영재센터 · 학원 관리</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#18253c;background:#f3f6fb;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#122745;color:white;padding:25px 5vw;display:flex;justify-content:space-between;align-items:center;gap:18px}header strong{font-size:21px}header small{color:#c2d2ea}nav{display:flex;gap:8px;padding:20px 5vw;overflow:auto;background:white;border-bottom:1px solid #dce3ee}button{border:1px solid #ced8e6;background:white;border-radius:9px;padding:10px 15px;color:#253a58}button.active,button.primary{background:#214ed6;color:white;border-color:#214ed6}main{max-width:1250px;margin:30px auto;padding:0 25px}h1{font-size:27px;margin:0 0 10px}h2{font-size:20px}p{line-height:1.7}.muted{color:#5e6c81}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.card{background:white;border:1px solid #dce3ee;border-radius:15px;padding:22px}.stat strong{display:block;font-size:32px;margin-top:8px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}input,select,textarea{border:1px solid #bdcadc;border-radius:7px;padding:10px;background:white;max-width:100%}textarea{width:100%;min-height:100px}label{display:block;margin:12px 0}label input,label select{margin-left:8px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #e4eaf2;padding:14px 12px}th{color:#5e6c81;font-weight:500;font-size:14px}.scroll{overflow:auto}.tag{background:#edf2ff;color:#224fc2;border-radius:7px;padding:5px 9px;font-size:14px}.grid{display:grid;grid-template-columns:340px 1fr;gap:22px}.notice{border-left:4px solid #2c59d5;padding:12px 18px;background:#eaf0ff;color:#28446e}.report{line-height:1.9}.report h2{color:#214ed6}.empty{padding:25px;color:#66758b}#message{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;background:#122745;color:white;z-index:5}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6b92ff;outline-offset:2px}@media(max-width:760px){header{align-items:start;flex-direction:column}.stats{gap:8px}.card{padding:15px}.stat strong{font-size:25px}.grid{grid-template-columns:1fr}main{padding:0 14px}nav{padding:14px}nav button{white-space:nowrap}header small{font-size:14px}}@media print{header,nav,.stats,.toolbar,.controls,.notice,#message{display:none!important}main{margin:0;padding:0}.grid{display:block}.card{border:0;padding:0}body{background:white}.report{font-size:12pt} }
</style></head><body>
<header><strong>✳ 멘사창의영재센터</strong><small>초1~중3 · 수학, 스도쿠, 체스, 올림피아드, 과학, 국어</small></header>
<nav aria-label="주요 메뉴"></nav><main id="main"></main><div id="message" role="status" hidden></div>
<script>
'use strict';
const subjects=['수학','스도쿠','체스','올림피아드','과학','국어'];
const seed=()=>Array.from({length:30},(_,i)=>({id:i+1,name:`예시학생 ${String(i+1).padStart(2,'0')}`,grade:i%9<6?`초${i%9+1}`:`중${i%9-5}`,subject:subjects[i%6],before:55+i%30,score:Math.min(100,63+i%30),topic:'수와 연산 · 문제 해결',comment:'풀이 과정을 차근차근 설명하는 연습을 하고 있습니다.',goal:'풀이를 검토하고 실수를 줄이기',last:'기본 개념과 계산을 연습했습니다.'}));
let data={students:seed(),attendance:{},notes:[]};
try{const saved=JSON.parse(localStorage.getItem('mensa-demo-v1'));if(saved&&Array.isArray(saved.students)&&saved.attendance&&Array.isArray(saved.notes))data=saved;}catch{}
let page='학생 관리',selected=data.students[0]?.id||1,query='',template='성장 스토리';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let date=today();
function notify(s){const el=document.getElementById('message');el.textContent=s;el.hidden=false;setTimeout(()=>el.hidden=true,3500)}
function save(){try{localStorage.setItem('mensa-demo-v1',JSON.stringify(data));notify('이 브라우저에 저장했습니다.')}catch{notify('저장 공간을 사용할 수 없습니다. 이 화면에서만 유지됩니다.')}}
function student(){return data.students.find(s=>s.id===Number(selected))||data.students[0]}
const options=()=>data.students.map(s=>`<option value="${s.id}" ${s.id===Number(selected)?'selected':''}>${esc(s.name)} · ${esc(s.grade)}</option>`).join('');
function selectStudent(){return `<label>학생<select id="student">${options()}</select></label>`}
function render(){
document.querySelector('nav').innerHTML=['학생 관리','출결 관리','수학 학습 관리','상담 및 알림','학습보고서'].map(p=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${p}</button>`).join('');
const present=Object.values(data.attendance[date]||{}).filter(x=>x==='출석').length;
let html=`<h1>${page}</h1><p class="muted">예시 데이터로 연습하는 관리 공간입니다. 입력 내용은 현재 브라우저에만 저장됩니다.</p><div class="stats"><div class="card stat">등록 학생<strong>${data.students.length}<small>명</small></strong></div><div class="card stat">${esc(date)} 출석<strong>${present}<small>명</small></strong></div><div class="card stat">운영 규모<strong>100<small>명</small></strong></div></div>`;
if(page==='학생 관리')html+=`<section class="card"><div class="toolbar"><input id="search" aria-label="학생 이름 검색" placeholder="학생 이름 검색" value="${esc(query)}"><button id="add" class="primary">학생 추가</button></div><div class="scroll"><table><thead><tr><th>학생</th><th>학년</th><th>과목</th><th>최근 점수</th><th>학습 정보</th></tr></thead><tbody>${data.students.filter(s=>s.name.includes(query)).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.grade)}</td><td><span class="tag">${esc(s.subject)}</span></td><td>${s.score}점</td><td><button data-edit="${s.id}">수정</button></td></tr>`).join('')||'<tr><td colspan="5">검색 결과가 없습니다.</td></tr>'}</tbody></table></div></section>`;
if(page==='출결 관리')html+=`<section class="card"><label>출결 날짜 <input type="date" id="date" value="${date}"></label><div class="scroll"><table><thead><tr><th>학생</th><th>학년</th><th>출결 상태</th></tr></thead><tbody>${data.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.grade)}</td><td><select aria-label="${esc(s.name)} 출결" data-attend="${s.id}">${['미확인','출석','지각','결석','보강'].map(v=>`<option ${(data.attendance[date]?.[s.id]||'미확인')===v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></section>`;
if(page==='수학 학습 관리'){const s=student();html+=`<section class="card">${selectStudent()}<form id="learning"><div class="toolbar"><label>지난 점수 <input name="before" type="number" min="0" max="100" value="${s.before}" required></label><label>이번 점수 <input name="score" type="number" min="0" max="100" value="${s.score}" required></label></div>${[['topic','학습 내용'],['last','지난달 학습'],['comment','선생님 코멘트'],['goal','다음 목표']].map(([key,title])=>`<label>${title}<textarea name="${key}" required>${esc(s[key])}</textarea></label>`).join('')}<button class="primary">학습 정보 저장</button></form></section>`}
if(page==='상담 및 알림')html+=`<div class="grid"><section class="card"><h2>상담 기록 / 안내문 초안</h2>${selectStudent()}<form id="note"><label>구분 <select name="kind"><option>상담 기록</option><option>안내문 초안</option></select></label><label>내용<textarea name="text" required placeholder="상담 내용이나 학부모 안내문을 작성하세요."></textarea></label><button class="primary">기록 저장</button></form><p class="muted">저장만 하며 외부로 발송하지 않습니다.</p></section><section class="card"><h2>최근 기록</h2>${data.notes.length?data.notes.slice().reverse().map(n=>`<article><p><span class="tag">${esc(n.kind)}</span> ${esc(data.students.find(s=>s.id===n.student)?.name)} · ${esc(n.date)}</p><p style="white-space:pre-wrap">${esc(n.text)}</p><hr></article>`).join(''):'<p class="empty">아직 기록이 없습니다.</p>'}</section></div>`;
if(page==='학습보고서'){const s=student();html+=`<div class="grid"><section class="card controls"><h2>보고서 설정</h2>${selectStudent()}<label>보고서 양식<select id="template">${['성장 스토리','주간 체크','클래식 리포트'].map(t=>`<option ${t===template?'selected':''}>${t}</option>`).join('')}</select></label><p class="notice">지금은 입력한 학습정보로 만든 미리보기입니다. AI 생성은 3단계에서 연결합니다.</p></section><section class="card report"><span class="tag">${esc(template)} · 미리보기</span><h2>멘사창의영재센터 학습보고서</h2><p>${esc(s.name)} · ${esc(s.grade)} · ${esc(date)}</p>${template==='성장 스토리'?`<h3>지난달</h3><p>${esc(s.last)}</p><h3>이번 달</h3><p>${esc(s.topic)}</p><p>${esc(s.comment)}</p><h3>다음 목표</h3><p>${esc(s.goal)}</p>`:template==='주간 체크'?`<h3>이번 주 학습 체크</h3>${['개념 이해','문제 풀이','오답 복습','과제 완료'].map(t=>`<label><input type="checkbox"> ${t}</label>`).join('')}<p>학습 내용: ${esc(s.topic)}</p><p>다음 목표: ${esc(s.goal)}</p>`:`<h3>점수 변화</h3><p>${s.before}점 → ${s.score}점 (${s.score-s.before>=0?'+':''}${s.score-s.before}점)</p><h3>학습 내용</h3><p>${esc(s.topic)}</p><h3>선생님 코멘트</h3><p>${esc(s.comment)}</p>`}</section></div>`}
document.getElementById('main').innerHTML=html;bind();}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});
document.getElementById('search')?.addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)});
document.getElementById('date')?.addEventListener('change',e=>{if(e.target.value){date=e.target.value;render()}});
document.querySelectorAll('[data-attend]').forEach(el=>el.onchange=()=>{data.attendance[date]??={};data.attendance[date][el.dataset.attend]=el.value;save();render()});
document.getElementById('student')?.addEventListener('change',e=>{selected=Number(e.target.value);render()});
document.getElementById('template')?.addEventListener('change',e=>{template=e.target.value;render()});
document.getElementById('learning')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),s=student();for(const key of ['before','score'])s[key]=Number(f.get(key));for(const key of ['topic','last','comment','goal'])s[key]=f.get(key);save();render()});
document.getElementById('note')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),text=String(f.get('text')).trim();if(!text)return;data.notes.push({student:Number(selected),date:today(),kind:f.get('kind'),text});save();render()});
document.getElementById('add')?.addEventListener('click',()=>edit());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));}
function edit(id){const old=data.students.find(s=>s.id===id);const s=old||{name:'',grade:'초1',subject:'수학'};document.getElementById('main').innerHTML=`<h1>${old?'학생 수정':'학생 추가'}</h1><section class="card"><form id="studentForm"><label>학생 이름<input name="name" value="${esc(s.name)}" maxlength="40" required></label><label>학년<select name="grade">${['초1','초2','초3','초4','초5','초6','중1','중2','중3'].map(g=>`<option ${s.grade===g?'selected':''}>${g}</option>`).join('')}</select></label><label>과목<select name="subject">${subjects.map(g=>`<option ${s.subject===g?'selected':''}>${g}</option>`).join('')}</select></label><div class="toolbar"><button class="primary">저장</button><button type="button" id="cancel">취소</button></div></form></section>`;document.getElementById('cancel').onclick=render;document.getElementById('studentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;const values={name,grade:f.get('grade'),subject:f.get('subject')};if(old)Object.assign(old,values);else data.students.push({id:Math.max(0,...data.students.map(s=>s.id))+1,...values,before:0,score:0,topic:'아직 기록이 없습니다.',last:'아직 기록이 없습니다.',comment:'아직 기록이 없습니다.',goal:'학습 목표를 입력하세요.'});save();render()}}
render();
</script></body></html>
